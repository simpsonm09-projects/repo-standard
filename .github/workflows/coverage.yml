name: coverage

on:
  workflow_call:
    inputs:
      # Optional package cache. The recipe runs on a fresh runner, so a
      # repository that compiles a project (Go, Gradle, .NET, Cargo) restores
      # the same cache its other jobs use instead of rebuilding from zero
      # (C5.2). Empty by default: a repository with no build step is unaffected.
      cache_path:
        description: Extra paths for actions/cache, one per line.
        type: string
        default: ''
      cache_key:
        description: Cache key prefix for cache_path; ignored when cache_path is empty.
        type: string
        default: ''
      # A job that calls a reusable workflow cannot use `runner` or
      # `hashFiles` in `with`, so the key is built here from a static prefix
      # and the dependency files the caller names.
      cache_hash_files:
        description: Files whose hash keys the cache, one glob per line.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the pinned standard ref
        id: pin
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          ref="${WORKFLOW_REF##*@}"
          if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
            ref="$(grep -ohE 'repo-standard/\.github/workflows/[a-z0-9-]+\.yml@[0-9a-f]{40}' .github/workflows/ci.yml | head -n1 | sed 's/.*@//')"
          fi
          if [ -z "$ref" ]; then
            ref="${GITHUB_SHA}"
          fi
          echo "resolved standard ref: ${ref:-<none>}"
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout the pinned standard
        if: github.repository != 'simpsonm09-projects/repo-standard'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/repo-standard
          ref: ${{ steps.pin.outputs.ref }}
          path: .standard
          persist-credentials: false
      - name: Restore the repository package cache
        if: inputs.cache_path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache_path }}
          key: >-
            ${{ inputs.cache_key }}-${{ runner.os }}-${{
            inputs.cache_hash_files == '' && 'no-key' ||
            hashFiles(inputs.cache_hash_files) }}
      - name: Install pinned tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Run the coverage recipe
        run: just coverage
      - name: Patch coverage gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${GITHUB_REPOSITORY}" = "${GITHUB_REPOSITORY_OWNER}/repo-standard" ]; then
            node scripts/patch-coverage.mjs --lcov coverage/lcov.info --base "$BASE" --mode both --allow-missing-branch
          else
            node .standard/scripts/patch-coverage.mjs --lcov coverage/lcov.info --base "$BASE" --mode both --allow-missing-branch
          fi
      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
