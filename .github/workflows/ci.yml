name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    if: github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Check formatting
        run: just fmt-check
  lint:
    if: github.repository_owner == 'simpsonm09-projects'
    uses: ./.github/workflows/lint.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
  aislop:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/aislop.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
  security:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
  standard:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: ./.github/workflows/standard.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
  coverage:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: ./.github/workflows/coverage.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form

  hooks:
    if: github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Fetch the shared hook config
        # `install` fetches the public `hooks-v3` tag into
        # `.git/info/lefthook-remotes`; `validate` alone silently skips remotes.
        run: lefthook install
      - name: Assert the merged config
        run: |
          dump=$(lefthook dump)
          for job in core-fmt core-forbidden-files core-policy owner-signing; do
            grep -q "name: $job" <<<"$dump" || {
              echo "::error::the shared hook config did not load job $job"
              exit 1
            }
          done
      - name: Validate hook config
        run: lefthook validate
      # The required checks are the recipes the hooks run (C5.7). These four
      # only ever run from a hook, so this job is where CI confirms them.
      - name: Confirm the hook recipes
        run: |
          just agent-files
          git ls-files -z | xargs -0 -r just forbidden-files
          just workflows
          git ls-files -z -- '*.sh' '*.bash' | xargs -0 -r just shellcheck

  test:
    if: github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Check the manifest, recipes, and generated artifacts
        run: just check
      - name: Run the suite
        run: just test
      - name: Check the ruleset payload builder
        run: node scripts/ruleset-payload.mjs --self-test

  all-checks:
    if: always()
    needs: [fmt, lint, aislop, security, standard, coverage, hooks, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
