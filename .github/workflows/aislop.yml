name: aislop

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  aislop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The audit is one npm package tree. Caching npm's content store keeps
      # the download off the pull request path without putting Node and the
      # package tree into every other job's mise cache (C5.2).
      - name: Restore the npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-aislop-0.16.1-${{ runner.os }}
          restore-keys: |
            npm-aislop-0.16.1-
      # One run: the exit code is the gate, and the SARIF it writes is uploaded
      # below. Running the audit twice doubled the slowest required job.
      - name: Enforce the score gate
        run: npx --yes aislop@0.16.1 ci --sarif > aislop.sarif
      # SARIF lands in the Security tab only when code scanning is available,
      # which a free private repository does not have. It is also not a gate,
      # so it stays off the pull request path (C5.4).
      - name: Upload SARIF
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: aislop.sarif
