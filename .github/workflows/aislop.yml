name: aislop

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  aislop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The audit shells out to the package manager, so the pinned tool set has
      # to be on PATH, not only the Node that runs npx.
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Scan and write SARIF
        run: npx --yes aislop@0.16.1 ci --sarif > aislop.sarif
        continue-on-error: true
      # SARIF lands in the Security tab only when code scanning is available,
      # which a free private repository does not have. Keep the upload
      # best-effort so the score gate above is the real failure signal.
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: aislop.sarif
      - name: Enforce the score gate
        run: npx --yes aislop@0.16.1 ci
